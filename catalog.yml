        status: idea
    - name: Pressure & Altitude
      children:
      - name: esp-dps310-baro
        blurb: DPS310 barometer
        status: validating
    - name: Force & Load
      children:
      - name: esp-hx711-loadcell
        blurb: HX711 load cell amplifier
        status: validating
      - name: esp-nau7802-loadcell
        blurb: NAU7802 bridge ADC, I2C
        status: validating
    - name: Power & Battery
      children:
      - name: esp-ina2xx-sensor
        blurb: INA2xx power monitor
        status: validating
        highlight: true
