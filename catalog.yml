      - name: esp-max17048-fuelgauge
        blurb: MAX17048 1S fuel gauge
        status: validating
      - name: esp-bq769x0-bms
        blurb: bq769x0 3-15S pack monitor
        status: validating
  - name: Input & Controllers
    children:
