# Source of truth for the catalog and the profile trees.
#
# status: available | validating | ongoing | idea
#   available  ✅  public and hardware validated
#   validating 🧪  written, being checked on real hardware
#   ongoing    🚧  written, not yet on hardware
#   idea       🧭  wanted, not started - this is the backlog
#
# highlight: true puts an entry on the profile README as well.
# Regenerate both READMEs with: python3 tools/render.py

tree:
- name: ⚡ ESP32 / ESP-IDF
  children:
  - name: Actuators
    children:
    - name: esp-c620-control
      blurb: C620 motor control
      status: validating
      highlight: true
      profile_blurb: RoboMaster M3508 / C620 motor control
    - name: esp-tmc5240-stepper
      blurb: TMC5240 stepper driver
      status: validating
    - name: esp-tmc2209-stepper
      blurb: TMC2209 stepper, UART
      status: ongoing
    - name: esp-drv8323-gatedriver
      blurb: DRV8323 BLDC gate driver
      status: ongoing
    - name: esp-pca9685-pwm
      blurb: PCA9685 16-ch PWM
      status: validating
  - name: Sensors
    children:
    - name: Motion & Orientation
      children:
      - name: esp-bmi088-imu
        blurb: BMI088 IMU interface
        status: validating
        highlight: true
        profile_blurb: BMI088 accelerometer + gyroscope
      - name: esp-icm45686-imu
        blurb: ICM-45686 IMU interface
        status: validating
      - name: esp-mpu6050-imu
        blurb: MPU-6050 IMU interface
        status: validating
      - name: esp-bno085-imu
        blurb: BNO085 IMU interface
        status: idea
      - name: esp-icm42688-imu
        blurb: ICM-42688 IMU interface
        status: idea
    - name: Magnetic Field
      children:
