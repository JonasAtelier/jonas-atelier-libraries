<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jonas Atelier — drivers, control, robotics</title>
  <desc id="desc">A cyan microchip connects to motor, sensor, and robot symbols on a midnight-blue circuit board. Subtle signal pulses travel along the traces beside the Jonas Atelier title.</desc>
  <defs>
    <linearGradient id="board" x2="1" y2="1">
      <stop stop-color="#0b1a2c"/><stop offset="1" stop-color="#050b15"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#16cbd5" stop-opacity=".14"/><stop offset="1" stop-color="#16cbd5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7bd9ed" stroke-opacity=".055"/>
      <circle cx="0" cy="0" r="1" fill="#7bd9ed" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .signal { stroke-dasharray: 14 420; animation: travel 7s linear infinite; }
      .late { animation-delay: -3.5s; }
      @keyframes travel { to { stroke-dashoffset: -434; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#board)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="url(#grid)" stroke="#1c3449"/>
  <ellipse cx="250" cy="180" rx="250" ry="175" fill="url(#halo)"/>

  <!-- Board traces sit behind the components. -->
  <g fill="none" stroke="#244b60" stroke-width="2" stroke-linejoin="round">
    <path d="M72 64h62l48 48h42v10M88 84h36l42 44h30"/>
    <path d="M304 146h40l56-56h40M304 162h48l56-56h48"/>
    <path d="M196 178h-50l-38 38H64M196 194h-42l-38 38H80"/>
    <path d="M224 234v36l-30 30H96M240 234v44l-38 38h-64"/>
    <path d="M272 234v26l40 40h82M288 234v18l32 32h58"/>
    <path d="M250 122V74l26-26h112M266 122V82l18-18h64"/>
    <path d="M304 194h68l26 26h46M304 210h60l26 26h38"/>
  </g>
  <g fill="none" stroke="#4de4ef" stroke-width="2" filter="url(#glow)">
    <path class="signal" d="M72 64h62l48 48h42v10"/>
    <path class="signal late" d="M304 146h40l56-56h40"/>
    <path class="signal" d="M224 234v36l-30 30H96"/>
    <path class="signal late" d="M304 194h68l26 26h46"/>
  </g>
  <g fill="#091625" stroke="#387388" stroke-width="2">
    <circle cx="72" cy="64" r="4"/><circle cx="88" cy="84" r="3"/>
    <circle cx="64" cy="216" r="4"/><circle cx="80" cy="232" r="3"/>
    <circle cx="96" cy="300" r="4"/><circle cx="138" cy="316" r="3"/>
    <circle cx="388" cy="48" r="4"/><circle cx="348" cy="64" r="3"/>
  </g>

  <!-- Central processor and its exposed pins. -->
  <g stroke="#55b3c4" stroke-width="5"><path d="M208122v-14m0 140v-14"/><path d="M224122v-14m0 140v-14"/><path d="M240122v-14m0 140v-14"/><path d="M256122v-14m0 140v-14"/><path d="M272122v-14m0 140v-14"/><path d="M288122v-14m0 140v-14"/><path d="M196 140h-14m140 0h-14"/><path d="M196 156h-14m140 0h-14"/><path d="M196 172h-14m140 0h-14"/><path d="M196 188h-14m140 0h-14"/><path d="M196 204h-14m140 0h-14"/><path d="M196 220h-14m140 0h-14"/></g>
  <rect x="196" y="122" width="108" height="112" rx="10" fill="#0b2032" stroke="#49d8e7" stroke-width="2" filter="url(#glow)"/>
  <rect x="207" y="133" width="86" height="90" rx="5" fill="#0a1524" stroke="#225367"/>
  <path d="M218 149v-6h8M282 207v6h-8" fill="none" stroke="#eeb46a" stroke-width="2"/>
  <text x="250" y="187" text-anchor="middle" fill="#deffff" font-family="monospace" font-size="29" font-weight="bold" letter-spacing="2">JA</text>
  <circle cx="218" cy="211" r="2" fill="#eeb46a"/>

  <!-- Sensor, motor, and robot endpoints. -->
  <g fill="#0b1929" stroke="#2f677d">
    <rect x="420" y="62" width="52" height="52" rx="10"/>
    <rect x="418" y="194" width="52" height="52" rx="10"/>
    <rect x="374" y="274" width="52" height="52" rx="10"/>
  </g>
  <g fill="none" stroke="#70dce5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="446" cy="88" r="4"/>
    <path d="M436 80a13 13 0 0 0 0 16m20-16a13 13 0 0 1 0 16M431 76a19 19 0 0 0 0 24m30-24a19 19 0 0 1 0 24"/>
    <circle cx="444" cy="220" r="13"/><path d="M438 225v-10l6 6 6-6v10m7-5h6"/>
    <rect x="386" y="291" width="28" height="20" rx="4"/><path d="M400 291v-6m-17 13h3m28 0h3m-23 8h12"/>
  </g>
  <g fill="#f1b669"><circle cx="394" cy="298" r="2"/><circle cx="406" cy="298" r="2"/><circle cx="400" cy="283" r="2"/></g>

  <path d="M514 72v216" stroke="#254154"/>
  <path d="M514 126v46" stroke="#52dce7" stroke-width="2"/>
  <text x="556" y="105" fill="#6cb4c7" font-family="monospace" font-size="12" letter-spacing="3">EMBEDDED LIBRARY WORKSHOP</text>
  <text x="552" y="179" fill="#f0f7ff" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="bold" letter-spacing="1">JONAS ATELIER</text>
  <text x="556" y="218" fill="#77dce6" font-family="monospace" font-size="18" letter-spacing="2">DRIVERS · CONTROL · ROBOTICS</text>
  <path d="M556 250h38" stroke="#efb567" stroke-width="3"/>
  <path d="M604 250h510" stroke="#21384c"/>
  <g fill="#46758c"><circle cx="1098" cy="278" r="2"/><circle cx="1106" cy="278" r="2"/></g>
  <circle cx="1114" cy="278" r="2" fill="#efb567"/>
  <g fill="none" stroke="#4b7388" stroke-width="1.5">
    <path d="M22 42V22h20M1158 22h20v20M22 318v20h20M1158 338h20v-20"/>
  </g>
</svg>
